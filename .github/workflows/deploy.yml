name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/branboos
            git pull
            cd deploy
            docker compose up -d --build \
              reverse-proxy ai-gateway ai-chatbot-app vendor-manager-app vendor-manager-cache
            docker compose ps
