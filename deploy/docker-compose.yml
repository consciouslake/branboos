
# BranBoos Suite — deployment compose file
# Usage per customer purchase:
#   Full suite:            docker compose --profile full up -d
#   Sales bundle:           docker compose --profile ai-chatbot --profile crm up -d
#   Procurement bundle:     docker compose --profile vendor-manager --profile erp up -d
#   Single product:         docker compose --profile ai-chatbot up -d   (AI Chatbot alone still needs the AI Gateway)

networks:
  branboos-net:
    driver: bridge

volumes:
  crm-db-data:
  crm-redis-data:
  crm-sites:
  crm-logs:
  erp-db-data:
  erp-redis-data:
  erp-sites:
  erp-logs:
  vendor-manager-cache-data:
  traefik-acme:

secrets:
  crm_apps_json:
    file: ./frappe/apps-crm.json
  erp_apps_json:
    file: ./frappe/apps-erp.json

services:

  # ── Reverse proxy ────────────────────────────────────────────────
  reverse-proxy:
    # Pinned patch releases (v3.0, v3.3) bundle an old Docker client that
    # requests API 1.24 and ignores DOCKER_API_VERSION — newer Docker Engine
    # (29+, min API 1.44) flat-out rejects that. `latest` carries a current
    # client that negotiates correctly.
    image: traefik:latest
    profiles: ["ai-chatbot", "vendor-manager", "crm", "erp", "full"]
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.email=${TRAEFIK_ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount a directory, not the file itself — otherwise Docker creates
      # acme.json as a directory when it doesn't already exist, and Traefik
      # can't write its ACME account/cert data into it.
      - traefik-acme:/letsencrypt
    networks: [branboos-net]

  # ── AI Gateway (shared, internal only) ────────────────────────────
  ai-gateway:
    build:
      context: ../ai-gateway
      dockerfile: Dockerfile
    profiles: ["ai-chatbot", "vendor-manager", "full"]
    env_file:
      - path: .env
        required: false
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - KEYSTONE_SERVICE_TOKEN=${KEYSTONE_SERVICE_TOKEN:-}
    networks: [branboos-net]
    restart: unless-stopped
    # Internal only — never expose publicly. No Traefik labels, no ports mapping.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── AI Chatbot ─────────────────────────────────────────────────
  ai-chatbot-app:
    build:
      context: ../ai-chatbot
      dockerfile: Dockerfile
    profiles: ["ai-chatbot", "full"]
    depends_on:
      ai-gateway:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - KEYSTONE_URL=http://ai-gateway:8000
      - KEYSTONE_SERVICE_TOKEN=${KEYSTONE_SERVICE_TOKEN}
      - CRM_API_URL=http://crm-frontend:8080
      - CRM_API_TOKEN=${CRM_API_TOKEN}
    networks: [branboos-net]
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-chatbot.rule=Host(`chat.${BASE_DOMAIN}`)"
      - "traefik.http.routers.ai-chatbot.entrypoints=websecure"
      - "traefik.http.routers.ai-chatbot.tls.certresolver=le"
      - "traefik.http.services.ai-chatbot.loadbalancer.server.port=3000"

  # ── Vendor Manager ────────────────────────────────────────────────
  vendor-manager-app:
    build:
      context: ../vendor-manager
      dockerfile: Dockerfile
    profiles: ["vendor-manager", "full"]
    depends_on:
      ai-gateway:
        condition: service_healthy
      vendor-manager-cache:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - KEYSTONE_URL=http://ai-gateway:8000
      - KEYSTONE_SERVICE_TOKEN=${KEYSTONE_SERVICE_TOKEN}
      - ERP_API_URL=http://erp-frontend:8080
      - ERP_API_TOKEN=${ERP_API_TOKEN}
      - REDIS_URL=redis://vendor-manager-cache:6379
    networks: [branboos-net]
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vendor-manager.rule=Host(`vendors.${BASE_DOMAIN}`)"
      - "traefik.http.routers.vendor-manager.entrypoints=websecure"
      - "traefik.http.routers.vendor-manager.tls.certresolver=le"
      - "traefik.http.services.vendor-manager.loadbalancer.server.port=3000"

  vendor-manager-cache:
    image: redis:7-alpine
    profiles: ["vendor-manager", "full"]
    volumes:
      - vendor-manager-cache-data:/data
    networks: [branboos-net]
    restart: unless-stopped

  # ── CRM (Frappe CRM + branboos_crm app) ─────────────────────────
  # Real image, built from ./frappe (adapted from frappe_docker's
  # images/custom/Containerfile). apps-crm.json controls which apps get
  # baked in: frappe/crm + our own branboos-crm on top of it.
  #
  # First-time setup after `docker compose --profile crm up -d --build`:
  # the site doesn't exist until crm-create-site finishes (check its logs
  # with `docker compose logs -f crm-create-site`) — everything else will
  # be up but crm-frontend will 500 until that job completes.

  crm-db:
    image: mariadb:10.6
    profiles: ["crm", "ai-chatbot", "full"]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      - MYSQL_ROOT_PASSWORD=${CRM_DB_ROOT_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${CRM_DB_ROOT_PASSWORD}
    volumes:
      - crm-db-data:/var/lib/mysql
    networks: [branboos-net]
    restart: unless-stopped

  crm-redis:
    image: redis:7-alpine
    profiles: ["crm", "ai-chatbot", "full"]
    volumes:
      - crm-redis-data:/data
    networks: [branboos-net]
    restart: unless-stopped

  crm-configurator:
    build:
      context: ./frappe
      dockerfile: Containerfile
      args:
        FRAPPE_BRANCH: version-16
      secrets:
        - source: crm_apps_json
          target: apps_json
    image: branboos/crm:latest
    profiles: ["crm", "ai-chatbot", "full"]
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://$$REDIS_HOST/0";
        bench set-config -g redis_queue "redis://$$REDIS_HOST/1";
        bench set-config -g redis_socketio "redis://$$REDIS_HOST/1";
        bench set-config -gp socketio_port 9000;
    environment:
      - DB_HOST=crm-db
      - REDIS_HOST=crm-redis:6379
    volumes:
      - crm-sites:/home/frappe/frappe-bench/sites
      - crm-logs:/home/frappe/frappe-bench/logs
    networks: [branboos-net]

  crm-create-site:
    image: branboos/crm:latest
    profiles: ["crm", "ai-chatbot", "full"]
    depends_on:
      crm-configurator:
        condition: service_completed_successfully
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 120 crm-db:3306;
        wait-for-it -t 120 crm-redis:6379;
        if [ -d "sites/crm.${BASE_DOMAIN}" ]; then
          echo "CRM site already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%'
            --admin-password="${CRM_ADMIN_PASSWORD:-admin}"
            --db-root-username=root --db-root-password="${CRM_DB_ROOT_PASSWORD}"
            --install-app crm --install-app branboos_crm
            --set-default "crm.${BASE_DOMAIN}";
        fi
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN}
      - CRM_DB_ROOT_PASSWORD=${CRM_DB_ROOT_PASSWORD}
      - CRM_ADMIN_PASSWORD=${CRM_ADMIN_PASSWORD:-admin}
    volumes:
      - crm-sites:/home/frappe/frappe-bench/sites
      - crm-logs:/home/frappe/frappe-bench/logs
    networks: [branboos-net]

  crm-backend:
    image: branboos/crm:latest
    profiles: ["crm", "ai-chatbot", "full"]
    depends_on:
      crm-create-site:
        condition: service_completed_successfully
    volumes:
      - crm-sites:/home/frappe/frappe-bench/sites
      - crm-logs:/home/frappe/frappe-bench/logs
    networks: [branboos-net]
    restart: unless-stopped

  crm-frontend:
    image: branboos/crm:latest
    profiles: ["crm", "ai-chatbot", "full"]
    depends_on: [crm-backend, crm-websocket]
    command: ["nginx-entrypoint.sh"]
    environment:
      - BACKEND=crm-backend:8000
      - FRAPPE_SITE_NAME_HEADER=crm.${BASE_DOMAIN}
      - SOCKETIO=crm-websocket:9000
      - UPSTREAM_REAL_IP_ADDRESS=127.0.0.1
      - UPSTREAM_REAL_IP_HEADER=X-Forwarded-For
      - UPSTREAM_REAL_IP_RECURSIVE=off
      - PROXY_READ_TIMEOUT=120
      - CLIENT_MAX_BODY_SIZE=50m
    volumes:
      - crm-sites:/home/frappe/frappe-bench/sites
      - crm-logs:/home/frappe/frappe-bench/logs
    networks: [branboos-net]
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm.rule=Host(`crm.${BASE_DOMAIN}`)"
      - "traefik.http.routers.crm.entrypoints=websecure"
      - "traefik.http.routers.crm.tls.certresolver=le"
      - "traefik.http.services.crm.loadbalancer.server.port=8080"

  crm-queue:
    image: branboos/crm:latest
    profiles: ["crm", "ai-chatbot", "full"]
    depends_on:
      crm-create-site:
        condition: service_completed_successfully
    command: ["bench", "worker", "--queue", "short,default,long"]
    volumes:
      - crm-sites:/home/frappe/frappe-bench/sites
      - crm-logs:/home/frappe/frappe-bench/logs
    networks: [branboos-net]
    restart: unless-stopped

  crm-scheduler:
    image: branboos/crm:latest
    profiles: ["crm", "ai-chatbot", "full"]
    depends_on:
      crm-create-site:
        condition: service_completed_successfully
    command: ["bench", "schedule"]
    volumes:
      - crm-sites:/home/frappe/frappe-bench/sites
      - crm-logs:/home/frappe/frappe-bench/logs
    networks: [branboos-net]
    restart: unless-stopped

  crm-websocket:
    image: branboos/crm:latest
    profiles: ["crm", "ai-chatbot", "full"]
    depends_on:
      crm-create-site:
        condition: service_completed_successfully
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes:
      - crm-sites:/home/frappe/frappe-bench/sites
      - crm-logs:/home/frappe/frappe-bench/logs
    networks: [branboos-net]
    restart: unless-stopped

  # ── ERP (ERPNext + branboos_erp app) ─────────────────────────────
  # Same pattern as CRM above, apps-erp.json bakes in erpnext + branboos-erp.

  erp-db:
    image: mariadb:10.6
    profiles: ["erp", "vendor-manager", "full"]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      - MYSQL_ROOT_PASSWORD=${ERP_DB_ROOT_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${ERP_DB_ROOT_PASSWORD}
    volumes:
      - erp-db-data:/var/lib/mysql
    networks: [branboos-net]
    restart: unless-stopped

  erp-redis:
    image: redis:7-alpine
    profiles: ["erp", "vendor-manager", "full"]
    volumes:
      - erp-redis-data:/data
    networks: [branboos-net]
    restart: unless-stopped

  erp-configurator:
    build:
      context: ./frappe
      dockerfile: Containerfile
      args:
        FRAPPE_BRANCH: version-16
      secrets:
        - source: erp_apps_json
          target: apps_json
    image: branboos/erp:latest
    profiles: ["erp", "vendor-manager", "full"]
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://$$REDIS_HOST/0";
        bench set-config -g redis_queue "redis://$$REDIS_HOST/1";
        bench set-config -g redis_socketio "redis://$$REDIS_HOST/1";
        bench set-config -gp socketio_port 9000;
    environment:
      - DB_HOST=erp-db
      - REDIS_HOST=erp-redis:6379
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
      - erp-logs:/home/frappe/frappe-bench/logs
    networks: [branboos-net]

  erp-create-site:
    image: branboos/erp:latest
    profiles: ["erp", "vendor-manager", "full"]
    depends_on:
      erp-configurator:
        condition: service_completed_successfully
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 120 erp-db:3306;
        wait-for-it -t 120 erp-redis:6379;
        if [ -d "sites/erp.${BASE_DOMAIN}" ]; then
          echo "ERP site already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%'
            --admin-password="${ERP_ADMIN_PASSWORD:-admin}"
            --db-root-username=root --db-root-password="${ERP_DB_ROOT_PASSWORD}"
            --install-app erpnext --install-app branboos_erp
            --set-default "erp.${BASE_DOMAIN}";
        fi
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN}
      - ERP_DB_ROOT_PASSWORD=${ERP_DB_ROOT_PASSWORD}
      - ERP_ADMIN_PASSWORD=${ERP_ADMIN_PASSWORD:-admin}
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
      - erp-logs:/home/frappe/frappe-bench/logs
    networks: [branboos-net]

  erp-backend:
    image: branboos/erp:latest
    profiles: ["erp", "vendor-manager", "full"]
    depends_on:
      erp-create-site:
        condition: service_completed_successfully
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
      - erp-logs:/home/frappe/frappe-bench/logs
    networks: [branboos-net]
    restart: unless-stopped

  erp-frontend:
    image: branboos/erp:latest
    profiles: ["erp", "vendor-manager", "full"]
    depends_on: [erp-backend, erp-websocket]
    command: ["nginx-entrypoint.sh"]
    environment:
      - BACKEND=erp-backend:8000
      - FRAPPE_SITE_NAME_HEADER=erp.${BASE_DOMAIN}
      - SOCKETIO=erp-websocket:9000
      - UPSTREAM_REAL_IP_ADDRESS=127.0.0.1
      - UPSTREAM_REAL_IP_HEADER=X-Forwarded-For
      - UPSTREAM_REAL_IP_RECURSIVE=off
      - PROXY_READ_TIMEOUT=120
      - CLIENT_MAX_BODY_SIZE=50m
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
      - erp-logs:/home/frappe/frappe-bench/logs
    networks: [branboos-net]
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.erp.rule=Host(`erp.${BASE_DOMAIN}`)"
      - "traefik.http.routers.erp.entrypoints=websecure"
      - "traefik.http.routers.erp.tls.certresolver=le"
      - "traefik.http.services.erp.loadbalancer.server.port=8080"

  erp-queue:
    image: branboos/erp:latest
    profiles: ["erp", "vendor-manager", "full"]
    depends_on:
      erp-create-site:
        condition: service_completed_successfully
    command: ["bench", "worker", "--queue", "short,default,long"]
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
      - erp-logs:/home/frappe/frappe-bench/logs
    networks: [branboos-net]
    restart: unless-stopped

  erp-scheduler:
    image: branboos/erp:latest
    profiles: ["erp", "vendor-manager", "full"]
    depends_on:
      erp-create-site:
        condition: service_completed_successfully
    command: ["bench", "schedule"]
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
      - erp-logs:/home/frappe/frappe-bench/logs
    networks: [branboos-net]
    restart: unless-stopped

  erp-websocket:
    image: branboos/erp:latest
    profiles: ["erp", "vendor-manager", "full"]
    depends_on:
      erp-create-site:
        condition: service_completed_successfully
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
      - erp-logs:/home/frappe/frappe-bench/logs
    networks: [branboos-net]
    restart: unless-stopped
